    <!-- Cartões de destaque -->
    <section class="cards">

      <div class="card card-speed">
        <div class="card-label">VELOCIDADE ATUAL</div>
        <div class="card-value">
          <span id="currentSpeed">0.0</span>
          <span id="currentSpeedUnit" class="unit">km/h</span>
        </div>
        <div class="card-sub">
          <span id="currentSecondary">0.0</span>
          <span id="currentSecondaryUnit">m/s</span>
        </div>
        <div class="speed-bar">
          <div id="speedBarFill" class="speed-bar-fill"></div>
        </div>
      </div>

      <div class="card card-record">
        <div class="card-label">🏆 RECORDE</div>
        <div class="card-value">
          <span id="recordSpeed">0.0</span>
          <span id="recordSpeedUnit" class="unit">km/h</span>
        </div>
        <div class="card-sub">
          <span id="recordSecondary">0.0</span>
          <span id="recordSecondaryUnit">m/s</span>
        </div>
      </div>

      <div class="card card-counter">
        <div class="card-label">📊 MEDIÇÕES</div>
        <div class="card-value">
          <span id="counter">0</span>
        </div>
        <div class="card-sub">veículos detectados</div>
      </div>

      <div class="card card-avg">
        <div class="card-label">📈 MÉDIA</div>
        <div class="card-value">
          <span id="avgSpeed">0.0</span>
          <span id="avgSpeedUnit" class="unit">km/h</span>
        </div>
        <div class="card-sub">
          <span id="avgSecondary">0.0</span>
          <span id="avgSecondaryUnit">m/s</span>
        </div>
      </div>

    </section>
